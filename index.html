<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMIO</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

img {
    max-width: 50%;
    max-height: 50%;
    pointer-events: none;
    -webkit-user-drag: none;
    user-drag: none;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.container p {
    margin-top: 20px;
    color: white;
    font-size: 2rem;
    font-family: Arial, sans-serif;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <img src="bg.jpeg"
         alt="BG"
         draggable="false">

<p>Hi!</p> 
<p>Did you bring toilet paper?</p> 
<p>...or just snooping around?</p>


</div>

<script>
// Disable right click
document.addEventListener("contextmenu", e => e.preventDefault());

// Disable common save shortcuts
document.addEventListener("keydown", function(e) {
    if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey &&
            ["I","J","C"].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && ["S","U","P"].includes(e.key.toUpperCase()))
    ) {
        e.preventDefault();
    }
});

// Prevent dragging
document.addEventListener("dragstart", e => e.preventDefault());
</script>

</body>
</html>
